openapi: 3.1.0
info:
  title: Loomtale Studio API
  version: 0.1.0
  description: Internal story-to-YouTube video studio API.
servers:
  - url: /api/v1
paths:
  /healthz:
    $ref: paths/health.yaml#/healthz
  /readyz:
    $ref: paths/health.yaml#/readyz
  /auth/login:
    $ref: paths/auth.yaml#/login
  /auth/logout:
    $ref: paths/auth.yaml#/logout
  /auth/me:
    $ref: paths/auth.yaml#/me
  /auth/switch-tenant:
    $ref: paths/auth.yaml#/switchTenant
  /auth/csrf:
    $ref: paths/auth.yaml#/csrf
  /assets/presign:
    $ref: paths/assets.yaml#/presign
  /assets/{id}/finalize:
    $ref: paths/assets.yaml#/finalize
  /assets/{id}:
    $ref: paths/assets.yaml#/getAsset
  /assets:
    $ref: paths/assets.yaml#/listAssets
  /audit:
    $ref: paths/audit.yaml#/listAudit
  /runs:
    $ref: paths/jobs.yaml#/createRun
  /runs/{id}:
    $ref: paths/jobs.yaml#/getRun
  /runs/{id}/steps:
    $ref: paths/jobs.yaml#/listRunSteps
  /runs/{id}/cancel:
    $ref: paths/jobs.yaml#/cancelRun
  /steps/{id}/retry:
    $ref: paths/jobs.yaml#/retryStep
  /steps/{id}/cancel:
    $ref: paths/jobs.yaml#/cancelStep
  /steps/{id}/log:
    $ref: paths/jobs.yaml#/getStepLog
  /jobs:
    $ref: paths/jobs.yaml#/listJobs
  /gpu:
    $ref: paths/gpu.yaml#/getGpuStatus
  /settings/llm:
    $ref: paths/settings_llm.yaml#/llmSettings
  /settings/llm/test:
    $ref: paths/settings_llm.yaml#/testLLMSettings
  /settings/llm/keys/{provider}:
    $ref: paths/settings_llm.yaml#/putLLMApiKey
  /settings/llm/cli-status:
    $ref: paths/settings_llm.yaml#/getClaudeCliStatus
  /series:
    $ref: paths/series.yaml#/seriesCollection
  /series/{id}:
    $ref: paths/series.yaml#/seriesItem
  /series/{id}/generate:
    $ref: paths/series.yaml#/generateSeries
  /series/{id}/bible:
    $ref: paths/series.yaml#/seriesBible
  /episodes:
    $ref: paths/episodes.yaml#/episodesCollection
  /episodes/{id}:
    $ref: paths/episodes.yaml#/episodeItem
  /episodes/{id}/ai-actions:
    $ref: paths/episodes.yaml#/createAiAction
  /episodes/{id}/ai-actions/{stepId}:
    $ref: paths/episodes.yaml#/getAiActionResult
  /episodes/{id}/drafts/{lang}:
    $ref: paths/episodes.yaml#/episodeDraft
  /episodes/{id}/drafts/{lang}/apply-step:
    $ref: paths/episodes.yaml#/applyDraftStep
  /imports:
    $ref: paths/imports.yaml#/importsCollection
  /imports/{id}:
    $ref: paths/imports.yaml#/importItem
  /imports/{id}/preview:
    $ref: paths/imports.yaml#/previewImport
  /imports/{id}/commit:
    $ref: paths/imports.yaml#/commitImport
  /models:
    $ref: paths/models.yaml#/listModels
  /models/unload:
    $ref: paths/models.yaml#/unloadModels
  /models/{name}/install:
    $ref: paths/models.yaml#/installModel
  /models/{name}/pause:
    $ref: paths/models.yaml#/pauseModelInstall
  /models/{name}/load:
    $ref: paths/models.yaml#/loadModel
  /events:
    $ref: paths/events.yaml#/events
components:
  schemas:
    Problem:
      $ref: schemas/problem.yaml#/Problem
