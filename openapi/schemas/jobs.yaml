PipelineRun:
  type: object
  required: [id, scopeKind, scopeId, kind, status, createdAt]
  properties:
    id:
      type: string
      format: uuid
    scopeKind:
      type: string
    scopeId:
      type: string
      format: uuid
    kind:
      type: string
    status:
      type: string
      enum: [active, done, failed, canceled, superseded]
    supersededBy:
      type: string
      format: uuid
    createdAt:
      type: string
      format: date-time
PipelineStep:
  type: object
  required:
    - id
    - runId
    - scopeKind
    - scopeId
    - kind
    - queue
    - priority
    - status
    - attempt
    - version
    - remainingDeps
    - progress
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    runId:
      type: string
      format: uuid
    scopeKind:
      type: string
    scopeId:
      type: string
      format: uuid
    kind:
      type: string
    queue:
      type: string
      enum: [gpu, cpu, llm, render, io]
    providerRef:
      type: string
    priority:
      type: integer
    status:
      type: string
      enum: [pending, queued, running, done, failed, canceled]
    attempt:
      type: integer
    version:
      type: integer
      format: int64
    remainingDeps:
      type: integer
    progress:
      type: integer
    etaS:
      type: integer
    errorCode:
      type: string
    errorMsg:
      type: string
    logAssetId:
      type: string
      format: uuid
    startedAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
PipelineStepList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/PipelineStep"
    nextCursor:
      type: string
CreateStepSpec:
  type: object
  required: [clientRef, kind, scopeKind, scopeId]
  properties:
    clientRef:
      type: string
      description: >-
        Caller-chosen token, unique within this request, used only to
        wire dependsOn between steps of the same request. The server
        always generates the step's real id; a client can never choose
        one, which is what keeps a colliding id from ever being usable as
        a cross-tenant existence oracle.
      minLength: 1
      maxLength: 64
    kind:
      type: string
    scopeKind:
      type: string
    scopeId:
      type: string
      format: uuid
    dependsOn:
      type: array
      maxItems: 500
      items:
        type: string
        description: Another step's clientRef in this same request.
CreateRunRequest:
  type: object
  required: [scopeKind, scopeId, kind, priorityClass, steps]
  properties:
    scopeKind:
      type: string
    scopeId:
      type: string
      format: uuid
    kind:
      type: string
    priorityClass:
      type: string
      description: >-
        The run's urgency class, applied server-side to every step in it
        (see api/internal/pipeline priority constants); a client can
        never set a raw numeric priority, which is what stops any editor
        from marking batch work interactive and starving every other
        tenant on the single GPU.
      enum: [interactive, scene, batch, train_bench]
    steps:
      type: array
      minItems: 1
      maxItems: 500
      items:
        $ref: "#/CreateStepSpec"
StepLogUrl:
  type: object
  required: [url, expiresAt]
  properties:
    url:
      type: string
      format: uri
    expiresAt:
      type: string
      format: date-time
