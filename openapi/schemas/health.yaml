HealthStatus:
  type: object
  required: [status, version]
  properties:
    status:
      type: string
      enum: [ok]
    version:
      type: string
ReadyStatus:
  type: object
  required: [status]
  properties:
    status:
      type: string
      enum: [ok]
    checks:
      type: object
      additionalProperties:
        type: string
