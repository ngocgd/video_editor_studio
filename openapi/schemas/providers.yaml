# LLM provider settings (AC8: switching a tenant's provider via PUT
# takes effect on the next call, no restart). API keys themselves are
# never returned; ProviderStatus.configured only says whether one exists.
LLMActionOverrides:
  type: object
  properties:
    outline:
      type: string
    draft:
      type: string
    rewrite:
      type: string
    translate:
      type: string
    scene_split:
      type: string
    summary:
      type: string
ProviderStatus:
  type: object
  required: [name, available]
  properties:
    name:
      type: string
    available:
      type: boolean
    configured:
      type: boolean
    disabledReason:
      type: string
LLMSettings:
  type: object
  required: [default, overrides, providers]
  properties:
    default:
      type: string
    overrides:
      $ref: "#/LLMActionOverrides"
    providers:
      type: array
      items:
        $ref: "#/ProviderStatus"
LLMSettingsUpdate:
  type: object
  required: [default]
  properties:
    default:
      type: string
    overrides:
      $ref: "#/LLMActionOverrides"
LLMSettingsTestRequest:
  type: object
  properties:
    provider:
      type: string
      description: Provider name to test; defaults to the tenant's current default.
LLMSettingsTestResult:
  type: object
  required: [provider, ok]
  properties:
    provider:
      type: string
    ok:
      type: boolean
    detail:
      type: string
    latencyMs:
      type: integer
LLMApiKeyRequest:
  type: object
  required: [apiKey]
  properties:
    apiKey:
      type: string
      minLength: 1
      maxLength: 4096
      description: Write-only; never echoed back. Stored envelope-encrypted (kind=llm_api_key, owner_ref=provider).
ClaudeCliStatus:
  type: object
  required: [installed, authenticated, toolsDisabled]
  properties:
    installed:
      type: boolean
    version:
      type: string
    authenticated:
      type: boolean
    toolsDisabled:
      type: boolean
      description: Always true; the llm-cli sidecar runs claude with tool use disabled.
    detail:
      type: string
