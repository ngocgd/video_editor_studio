listAudit:
  get:
    operationId: listAudit
    summary: Cursor-paginated audit log for the active tenant (owner only)
    tags: [audit]
    x-min-role: owner
    parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
    responses:
      "200":
        description: page of audit entries
        content:
          application/json:
            schema:
              $ref: "../schemas/audit.yaml#/AuditList"
