llmSettings:
  get:
    operationId: getLLMSettings
    summary: The active tenant's LLM provider default and per-action overrides
    tags: [settings]
    x-min-role: viewer
    responses:
      "200":
        description: current LLM settings
        content:
          application/json:
            schema:
              $ref: "../schemas/providers.yaml#/LLMSettings"
  put:
    operationId: putLLMSettings
    summary: Switch the active tenant's default LLM provider or an action override (AC8)
    tags: [settings]
    x-min-role: owner
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/providers.yaml#/LLMSettingsUpdate"
    responses:
      "200":
        description: settings saved; the next matching call uses the new provider
        content:
          application/json:
            schema:
              $ref: "../schemas/providers.yaml#/LLMSettings"
      "400":
        description: unknown provider name
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
testLLMSettings:
  post:
    operationId: testLLMSettings
    summary: Run a 1-token prompt against a provider to confirm it is reachable and configured
    tags: [settings]
    x-min-role: editor
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../schemas/providers.yaml#/LLMSettingsTestRequest"
    responses:
      "200":
        description: test result
        content:
          application/json:
            schema:
              $ref: "../schemas/providers.yaml#/LLMSettingsTestResult"
      "429":
        description: rate limited (per tenant)
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
putLLMApiKey:
  put:
    operationId: putLLMApiKey
    summary: Store (or replace) the active tenant's API key for a provider; write-only, audited
    tags: [settings]
    x-min-role: owner
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/providers.yaml#/LLMApiKeyRequest"
    responses:
      "204":
        description: key stored
      "400":
        description: unknown provider or empty key
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
getClaudeCliStatus:
  get:
    operationId: getClaudeCliStatus
    summary: claude CLI version and auth state, as reported by the llm-cli sidecar
    tags: [settings]
    x-min-role: viewer
    responses:
      "200":
        description: claude CLI status
        content:
          application/json:
            schema:
              $ref: "../schemas/providers.yaml#/ClaudeCliStatus"
