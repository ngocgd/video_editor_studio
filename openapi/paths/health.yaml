healthz:
  get:
    operationId: getHealthz
    summary: Liveness probe
    tags: [health]
    responses:
      "200":
        description: process is alive
        content:
          application/json:
            schema:
              $ref: "../schemas/health.yaml#/HealthStatus"
readyz:
  get:
    operationId: getReadyz
    summary: Readiness probe (checks Postgres and MinIO)
    tags: [health]
    responses:
      "200":
        description: all dependencies are reachable
        content:
          application/json:
            schema:
              $ref: "../schemas/health.yaml#/ReadyStatus"
      "503":
        description: one or more dependencies failed
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/health.yaml#/Problem"
