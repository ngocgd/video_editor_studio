voicePresets:
  get:
    operationId: listVoicePresets
    summary: Voice presets of this tenant
    tags: [storyboard]
    x-min-role: viewer
    responses:
      "200":
        description: voice presets
        content:
          application/json:
            schema:
              $ref: "../schemas/presets.yaml#/VoicePresetList"
  post:
    operationId: createVoicePreset
    summary: Create a voice preset; a reference voice needs the consent flag, which is audited
    tags: [storyboard]
    x-min-role: editor
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/presets.yaml#/VoicePresetInput"
    responses:
      "201":
        description: voice preset created
        content:
          application/json:
            schema:
              $ref: "../schemas/presets.yaml#/VoicePreset"
      "400":
        description: invalid request
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
      "422":
        description: reference audio missing, not audio, or no consent; or a parameter is a server-set control key, unknown, or malformed
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
voicePresetItem:
  put:
    operationId: updateVoicePreset
    summary: Replace a voice preset
    tags: [storyboard]
    x-min-role: editor
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/presets.yaml#/VoicePresetInput"
    responses:
      "200":
        description: voice preset updated
        content:
          application/json:
            schema:
              $ref: "../schemas/presets.yaml#/VoicePreset"
      "400":
        description: invalid request
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
      "404":
        description: voice preset not found in this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
      "422":
        description: reference audio missing, not audio, or no consent; or a parameter is a server-set control key, unknown, or malformed
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
  delete:
    operationId: deleteVoicePreset
    summary: Delete a voice preset that no voice uses
    tags: [storyboard]
    x-min-role: editor
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: deleted
      "404":
        description: voice preset not found in this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
      "409":
        description: a character or narrator voice still uses it
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
