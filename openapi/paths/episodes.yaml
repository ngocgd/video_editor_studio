episodesCollection:
  get:
    operationId: listEpisodes
    summary: Cursor-paginated list of a series' episodes, with aggregated draft status (no N+1)
    tags: [episodes]
    x-min-role: viewer
    parameters:
      - name: seriesId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
    responses:
      "200":
        description: page of episodes
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/EpisodeList"
  post:
    operationId: createEpisode
    summary: Append a new, empty episode to a series
    tags: [episodes]
    x-min-role: editor
    parameters:
      - name: seriesId
        in: query
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "201":
        description: episode created
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/Episode"
      "404":
        description: series not found in this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
episodeItem:
  get:
    operationId: getEpisode
    summary: Episode outline and metadata
    tags: [episodes]
    x-min-role: viewer
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: episode
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/Episode"
      "404":
        description: episode not found in this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
  patch:
    operationId: updateEpisode
    summary: Update episode title/status
    tags: [episodes]
    x-min-role: editor
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/story.yaml#/EpisodeUpdateRequest"
    responses:
      "200":
        description: episode updated
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/Episode"
      "404":
        description: episode not found in this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
createAiAction:
  post:
    operationId: createAiAction
    summary: Enqueue a streaming AI writing action at interactive priority
    tags: [episodes]
    x-min-role: editor
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/story.yaml#/AiActionRequest"
    responses:
      "202":
        description: AI action step created; poll getAiActionResult with the returned stepId for the result
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/AiActionResponse"
      "404":
        description: episode not found in this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
      "429":
        description: no LLM provider available for this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
getAiActionResult:
  get:
    operationId: getAiActionResult
    summary: Poll an AI action step's status and, once done, its generated text
    tags: [episodes]
    x-min-role: viewer
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: stepId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: current step status, with text once done
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/AiActionResult"
      "404":
        description: episode or step not found in this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
episodeDraft:
  get:
    operationId: getDraft
    summary: The episode's draft for one language
    tags: [episodes]
    x-min-role: viewer
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lang
        in: path
        required: true
        schema:
          $ref: "../schemas/story.yaml#/DraftLanguage"
    responses:
      "200":
        description: draft
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/EpisodeDraft"
      "404":
        description: episode or draft not found in this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
  put:
    operationId: createDraft
    summary: Create an empty draft for this episode/language if one does not already exist
    tags: [episodes]
    x-min-role: editor
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lang
        in: path
        required: true
        schema:
          $ref: "../schemas/story.yaml#/DraftLanguage"
    responses:
      "201":
        description: an empty draft was created
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/EpisodeDraft"
      "200":
        description: a draft already existed; it is returned unchanged
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/EpisodeDraft"
      "404":
        description: episode not found in this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
  patch:
    operationId: patchDraft
    summary: Autosave paragraph ops with an optimistic-concurrency version check
    tags: [episodes]
    x-min-role: editor
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lang
        in: path
        required: true
        schema:
          $ref: "../schemas/story.yaml#/DraftLanguage"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/story.yaml#/DraftPatchRequest"
    responses:
      "200":
        description: draft updated
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/EpisodeDraft"
      "409":
        description: expectedVersion is stale; client should refetch and merge
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
applyDraftStep:
  post:
    operationId: applyDraftStep
    summary: Apply a finished AI action step's output to the draft server-side, with taint/origin computed from the step and the paragraphs it replaces or follows
    tags: [episodes]
    x-min-role: editor
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lang
        in: path
        required: true
        schema:
          $ref: "../schemas/story.yaml#/DraftLanguage"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/story.yaml#/ApplyDraftStepRequest"
    responses:
      "200":
        description: draft updated with the step's output
        content:
          application/json:
            schema:
              $ref: "../schemas/story.yaml#/EpisodeDraft"
      "404":
        description: episode or draft not found in this tenant
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
      "409":
        description: the step is not a done AI action step scoped to this episode
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
