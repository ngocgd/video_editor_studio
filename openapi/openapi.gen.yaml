          type: string
          format: uuid
    AiActionResult:
      type: object
      description: 'The step''s current status and, once done, its full generated text. There is no incremental token payload today: a client polls or subscribes to the step''s SSE transition and then fetches this once the step reaches a terminal status.'
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - queued
            - running
            - done
            - failed
            - canceled
        provider:
          type: string
        lang:
          $ref: '#/components/schemas/TargetLanguage'
        text:
          type: string
        tainted:
          type: boolean
        errorDetail:
          type: string
    DraftLanguage:
      type: string
      description: Every language an episode_drafts row can be stored under. Includes `zh` for an import's own source-language draft (see CommitImport); AI-action targets and the writer's translate toggle still only offer en/vi (TargetLanguage).
      enum:
        - en
        - vi
        - zh
