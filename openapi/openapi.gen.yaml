            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '400':
          description: asset not ready, wrong MIME, or over the 10MB text cap
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /imports/{id}:
    get:
      operationId: getImport
      summary: Import status and chapter preview
      tags:
        - imports
      x-min-role: viewer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '404':
          description: import not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /imports/{id}/preview:
    post:
      operationId: previewImport
      summary: Detect encoding and split into chapters using a regex preset, without committing episodes
      tags:
        - imports
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPreviewRequest'
      responses:
        '200':
          description: chapter preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        '422':
          description: decoding failed or no chapters matched the preset (reported, not guessed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /imports/{id}/commit:
    post:
      operationId: commitImport
      summary: Turn previewed chapters into episodes, optionally translating each
      tags:
        - imports
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommitRequest'
      responses:
        '200':
          description: episodes created from the selected chapters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCommitResponse'
        '409':
          description: import is not in preview status
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /models:
    get:
      operationId: listModels
      summary: Every manifest model with its licence, install state and residency
      tags:
        - models
      x-min-role: viewer
      responses:
        '200':
          description: model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
  /models/unload:
    post:
      operationId: unloadModels
      summary: Unload every resident GPU model (a models.unload step on the gpu queue)
      tags:
        - models
      x-min-role: editor
      responses:
        '202':
          description: unload queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelActionResult'
  /models/{name}/install:
    post:
      operationId: installModel
      summary: Download and verify a model (a models.pull step on the io queue), or resume a paused download
      tags:
        - models
      x-min-role: owner
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9.-]{1,62}$
      responses:
        '202':
          description: install queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'
        '404':
          description: no such model in the manifest
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: already installed or already downloading
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: licence not in the allowlist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /models/{name}/pause:
    post:
      operationId: pauseModelInstall
      summary: Pause a running download; partial files are kept and a later install resumes them
      tags:
        - models
      x-min-role: owner
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9.-]{1,62}$
      responses:
        '200':
          description: download paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'
        '404':
          description: no such model in the manifest
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: no download is running for this model
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /models/{name}/load:
    post:
      operationId: loadModel
      summary: Make a model the single resident GPU model (a models.load step on the gpu queue)
      tags:
        - models
      x-min-role: editor
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9.-]{1,62}$
      responses:
        '202':
          description: load queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelActionResult'
        '404':
          description: no such model in the manifest
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: model is not installed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: licence not in the allowlist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /events:
    get:
      operationId: streamEvents
      summary: |-
        Server-sent events for pipeline step progress and state changes. Cookie-authenticated, tenant-filtered. Requires a "topics" query parameter: a comma-separated list of pipeline run ids the caller's tenant owns (checked against pipeline_runs at subscribe time; an unknown or foreign topic is rejected with 403).
        The first event on every stream is "ready"; a client must subscribe before fetching its own initial snapshot (GET /runs/{id}/steps) and discard any event whose "version" is <= the snapshot's, so no event that arrived between snapshot and subscribe is lost.
        Progress-only updates are coalesced to at most one per step id per 250ms; every state transition (queued/running/done/failed/canceled) is delivered individually and is never dropped or coalesced. If the hub's own LISTEN connection drops and reconnects, every subscriber receives a "resync" event and must refetch its snapshot. A 15s heartbeat comment line keeps idle connections alive through proxies. A user may hold at most 6 concurrent streams (429 beyond that); the web client shares one stream across browser tabs.
      tags:
        - jobs
      x-min-role: viewer
      parameters:
        - name: topics
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated pipeline run ids.
      responses:
        '200':
          description: text/event-stream of step events
          content:
            text/event-stream:
              schema:
                type: string
        '403':
          description: an unknown or foreign topic was requested
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: too many concurrent streams for this user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Problem:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
    HealthStatus:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
    ReadyStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
        checks:
          type: object
          additionalProperties:
            type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 1024
    Role:
      type: string
      enum:
        - owner
        - editor
        - viewer
    TenantMembership:
      type: object
      required:
        - tenantId
        - tenantName
        - role
      properties:
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    Me:
      type: object
      required:
        - userId
        - email
        - tenants
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        activeTenantId:
          type: string
          format: uuid
        activeRole:
          $ref: '#/components/schemas/Role'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantMembership'
    LoginResponse:
      type: object
      required:
        - me
        - csrfToken
      properties:
        me:
          $ref: '#/components/schemas/Me'
        csrfToken:
          type: string
    SwitchTenantRequest:
      type: object
      required:
        - tenantId
      properties:
        tenantId:
          type: string
          format: uuid
    CsrfToken:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    AssetKind:
      type: string
      enum:
        - image
        - audio
        - video
        - document
    PresignRequest:
      type: object
      required:
        - kind
        - mime
        - bytes
      properties:
        kind:
          $ref: '#/components/schemas/AssetKind'
        mime:
          type: string
        bytes:
          type: integer
          format: int64
          minimum: 1
        filename:
          type: string
    PresignResponse:
      type: object
      required:
        - assetId
        - uploadUrl
        - fields
        - expiresAt
      properties:
        assetId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    Asset:
      type: object
      required:
        - id
        - kind
        - mime
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/AssetKind'
        mime:
          type: string
        bytes:
          type: integer
          format: int64
        sha256:
          type: string
        width:
          type: integer
        height:
          type: integer
        durationMs:
          type: integer
        status:
          type: string
          enum:
            - pending
            - ready
            - failed
        downloadUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
    AssetList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        nextCursor:
          type: string
    AuditEntry:
      type: object
      required:
        - id
        - action
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        actorEmail:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuditList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          type: string
    CreateStepSpec:
      type: object
      required:
        - clientRef
        - kind
        - scopeKind
        - scopeId
      properties:
        clientRef:
          type: string
          description: Caller-chosen token, unique within this request, used only to wire dependsOn between steps of the same request. The server always generates the step's real id; a client can never choose one, which is what keeps a colliding id from ever being usable as a cross-tenant existence oracle.
          minLength: 1
          maxLength: 64
        kind:
          type: string
        scopeKind:
          type: string
        scopeId:
          type: string
          format: uuid
        dependsOn:
          type: array
          maxItems: 500
          items:
            type: string
            description: Another step's clientRef in this same request.
    CreateRunRequest:
      type: object
      required:
        - scopeKind
        - scopeId
        - kind
        - priorityClass
        - steps
      properties:
        scopeKind:
          type: string
        scopeId:
          type: string
          format: uuid
        kind:
          type: string
        priorityClass:
          type: string
          description: The run's urgency class, applied server-side to every step in it (see api/internal/pipeline priority constants); a client can never set a raw numeric priority, which is what stops any editor from marking batch work interactive and starving every other tenant on the single GPU.
          enum:
            - interactive
            - scene
            - batch
            - train_bench
        steps:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/CreateStepSpec'
    PipelineRun:
      type: object
      required:
        - id
        - scopeKind
        - scopeId
        - kind
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        scopeKind:
          type: string
        scopeId:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum:
            - active
            - done
            - failed
            - canceled
            - superseded
        supersededBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    PipelineStep:
      type: object
      required:
        - id
        - runId
        - scopeKind
        - scopeId
        - kind
        - queue
        - priority
        - status
        - attempt
        - version
        - remainingDeps
        - progress
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        scopeKind:
          type: string
        scopeId:
          type: string
          format: uuid
        kind:
          type: string
        queue:
          type: string
          enum:
            - gpu
            - cpu
            - llm
            - render
            - io
        providerRef:
          type: string
        priority:
          type: integer
        status:
          type: string
          enum:
            - pending
            - queued
            - running
            - done
            - failed
            - canceled
        attempt:
          type: integer
        version:
          type: integer
          format: int64
        remainingDeps:
          type: integer
        progress:
          type: integer
        etaS:
          type: integer
        errorCode:
          type: string
        errorMsg:
          type: string
        logAssetId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PipelineStepList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStep'
        nextCursor:
          type: string
    StepLogUrl:
      type: object
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    StepSummary:
      type: object
      required:
        - id
        - kind
        - status
        - priority
        - progress
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum:
            - pending
            - queued
            - running
            - done
            - failed
            - canceled
        priority:
          type: integer
        progress:
          type: integer
        etaS:
          type: integer
    GpuResident:
      type: object
      required:
        - backend
        - model
      properties:
        backend:
          type: string
        model:
          type: string
    GpuVram:
      type: object
      required:
        - totalMb
        - freeMb
        - budgetMb
        - renderReserveMb
        - measuredAt
      properties:
        totalMb:
          type: integer
          format: int64
        freeMb:
          type: integer
          format: int64
        budgetMb:
          type: integer
          format: int64
        renderReserveMb:
          type: integer
          format: int64
        measuredAt:
          type: string
          format: date-time
    GpuBackendStatus:
      type: object
      required:
        - name
        - reachable
        - loaded
      properties:
        name:
          type: string
        reachable:
          type: boolean
        loaded:
          type: array
          items:
            type: string
    GpuEncoder:
      type: object
      required:
        - name
        - hw
      properties:
        name:
          type: string
        hw:
          type: boolean
    GpuStatus:
      type: object
      required:
        - queue
        - backends
        - capabilities
      properties:
        running:
          $ref: '#/components/schemas/StepSummary'
        queue:
          type: array
          items:
