openapi: 3.1.0
info:
  title: Loomtale Studio API
  version: 0.1.0
  description: Internal story-to-YouTube video studio API.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags:
        - health
      x-min-role: public
      responses:
        '200':
          description: process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe (checks Postgres and MinIO)
      tags:
        - health
      x-min-role: public
      responses:
        '200':
          description: all dependencies are reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: one or more dependencies failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/login:
    post:
      operationId: login
      summary: Start a session with email + password
      tags:
        - auth
      x-min-role: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: session established; the session cookie is set via Set-Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: too many attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags:
        - auth
      x-min-role: authenticated
      responses:
        '204':
          description: session ended
  /auth/me:
    get:
      operationId: getMe
      summary: The caller's identity and tenant memberships
      tags:
        - auth
      x-min-role: authenticated
      responses:
        '200':
          description: current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
  /auth/switch-tenant:
    post:
      operationId: switchTenant
      summary: Switch the session's active tenant (must be a member)
      tags:
        - auth
      x-min-role: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchTenantRequest'
      responses:
        '200':
          description: active tenant switched; the response carries the new CSRF token (the session token was rotated, and the CSRF token is derived from it)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '404':
          description: not a member of that tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/csrf:
    get:
      operationId: getCsrf
      summary: The CSRF token for the current session
      tags:
        - auth
      x-min-role: authenticated
      responses:
        '200':
          description: current CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /assets/presign:
    post:
      operationId: presignAsset
      summary: Create a pending asset row and a browser upload URL for it
      tags:
        - assets
      x-min-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '201':
          description: pending asset created with a presigned POST policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResponse'
        '400':
          description: unsupported kind/mime or size over the per-kind cap
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/{id}/finalize:
    post:
      operationId: finalizeAsset
      summary: Verify an uploaded object and mark the asset ready
      tags:
        - assets
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: asset verified and marked ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          description: asset not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: object missing, MIME sniff mismatch, or size/type not allowed for kind
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/{id}:
    get:
      operationId: getAsset
      summary: Asset metadata, with a fresh browser download URL if ready
      tags:
        - assets
      x-min-role: viewer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: asset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          description: asset not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets:
    get:
      operationId: listAssets
      summary: Cursor-paginated list of the active tenant's assets
      tags:
        - assets
      x-min-role: viewer
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: page of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
  /audit:
    get:
      operationId: listAudit
      summary: Cursor-paginated audit log for the active tenant (owner only)
      tags:
        - audit
      x-min-role: owner
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: page of audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
  /runs:
    post:
      operationId: createRun
      summary: Create a pipeline run and its steps
      tags:
        - jobs
      x-min-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: run created, ready steps enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
        '400':
          description: invalid run/step spec
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: tenant quota exceeded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '507':
          description: admission check denied (e.g. disk watermark)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /runs/{id}:
    get:
      operationId: getRun
      summary: Get a pipeline run
      tags:
        - jobs
      x-min-role: viewer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
        '404':
          description: run not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /runs/{id}/steps:
    get:
      operationId: listRunSteps
      summary: Cursor-paginated list of a run's steps
      tags:
        - jobs
      x-min-role: viewer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: page of steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStepList'
        '400':
          description: invalid cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /runs/{id}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel every non-terminal step in a run
      tags:
        - jobs
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: run canceled
        '404':
          description: run not found in this tenant, or already finished
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /steps/{id}/retry:
    post:
      operationId: retryStep
      summary: Reset a failed or canceled step to queued and re-enqueue it
      tags:
        - jobs
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: step re-queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStep'
        '404':
          description: step not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: step exists but cannot be retried right now (unmet dependency, or its run is not active)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /steps/{id}/cancel:
    post:
      operationId: cancelStep
      summary: Cancel one step
      tags:
        - jobs
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: step canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStep'
        '404':
          description: step not found, or already terminal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /steps/{id}/log:
    get:
      operationId: getStepLog
      summary: Presigned URL for a step's scrubbed log, editor or owner only
      tags:
        - jobs
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: presigned log URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepLogUrl'
        '404':
          description: step not found, or has no log yet
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /jobs:
    get:
      operationId: listJobs
      summary: Cursor-paginated list of the tenant's steps, optionally filtered
      tags:
        - jobs
      x-min-role: viewer
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: queue
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: page of steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStepList'
        '400':
          description: invalid cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /gpu:
    get:
      operationId: getGpuStatus
      summary: Current GPU residency, queue and VRAM status for this tenant
      tags:
        - jobs
      x-min-role: viewer
      responses:
        '200':
          description: GPU status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuStatus'
  /settings/llm:
    get:
      operationId: getLLMSettings
      summary: The active tenant's LLM provider default and per-action overrides
      tags:
        - settings
      x-min-role: viewer
      responses:
        '200':
          description: current LLM settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMSettings'
    put:
      operationId: putLLMSettings
      summary: Switch the active tenant's default LLM provider or an action override (AC8)
      tags:
        - settings
      x-min-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMSettingsUpdate'
      responses:
        '200':
          description: settings saved; the next matching call uses the new provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMSettings'
        '400':
          description: unknown provider name
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /settings/llm/test:
    post:
      operationId: testLLMSettings
      summary: Run a 1-token prompt against a provider to confirm it is reachable and configured
      tags:
        - settings
      x-min-role: editor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMSettingsTestRequest'
      responses:
        '200':
          description: test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMSettingsTestResult'
        '429':
          description: rate limited (per tenant)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /settings/llm/keys/{provider}:
    put:
      operationId: putLLMApiKey
      summary: Store (or replace) the active tenant's API key for a provider; write-only, audited
      tags:
        - settings
      x-min-role: owner
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMApiKeyRequest'
      responses:
        '204':
          description: key stored
        '400':
          description: unknown provider or empty key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /settings/llm/cli-status:
    get:
      operationId: getClaudeCliStatus
      summary: claude CLI version and auth state, as reported by the llm-cli sidecar
      tags:
        - settings
      x-min-role: viewer
      responses:
        '200':
          description: claude CLI status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeCliStatus'
  /channels:
    get:
      operationId: listYouTubeChannels
      summary: The tenant's connected YouTube channels and today's quota usage
      tags:
        - channels
      x-min-role: viewer
      responses:
        '200':
          description: channels, connected ones first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouTubeChannelList'
  /channels/connect:
    post:
      operationId: startYouTubeConnect
      summary: Start the Google OAuth flow (PKCE, single-use state bound to this session)
      tags:
        - channels
      x-min-role: owner
      responses:
        '200':
          description: consent URL to navigate to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouTubeConnectStart'
        '503':
          description: no Google OAuth client is configured on this server
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /channels/oauth/callback:
    get:
      operationId: youTubeOAuthCallback
      summary: Google redirects here after consent; stores the channel and redirects back to Settings
      description: Always answers with a redirect to /settings/youtube carrying connect=ok or connect=error plus a short reason code. Tokens are exchanged server side and never reach the browser.
      tags:
        - channels
      x-min-role: owner
      parameters:
        - name: code
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          schema:
            type: string
            maxLength: 256
        - name: error
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        '302':
          description: back to the Settings page
          headers:
            Location:
              required: true
              schema:
                type: string
  /channels/{id}:
    patch:
      operationId: updateYouTubeChannelAudit
      summary: Record whether the Google API project passed YouTube's audit (audited)
      tags:
        - channels
      x-min-role: owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YouTubeChannelAuditUpdate'
      responses:
        '200':
          description: channel updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouTubeChannel'
        '404':
          description: channel not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: disconnectYouTubeChannel
      summary: Revoke the channel's token at Google, delete it and mark the channel disconnected (audited)
      tags:
        - channels
      x-min-role: owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: disconnected
        '404':
          description: channel not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /analytics/channels/{id}/overview:
    get:
      operationId: getAnalyticsOverview
      summary: A channel's daily totals over a window, its sync state and its YouTube Partner Program progress
      description: Reads only the pre-aggregated daily tables. The window defaults to the 28 days ending at the newest synced day. A metric YouTube did not provide is absent with its reason in `unavailable`, never 0.
      tags:
        - analytics
      x-min-role: viewer
      parameters:
        - $ref: '#/components/parameters/analyticsChannelId'
        - $ref: '#/components/parameters/analyticsFrom'
        - $ref: '#/components/parameters/analyticsTo'
      responses:
        '200':
          description: overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          $ref: '#/components/responses/analyticsBadRequest'
        '404':
          $ref: '#/components/responses/analyticsChannelNotFound'
  /analytics/channels/{id}/sync:
    post:
      operationId: syncAnalyticsChannel
      summary: Queue an analytics sync of the channel now (deduplicated with a sync already queued)
      tags:
        - analytics
      x-min-role: editor
      parameters:
        - $ref: '#/components/parameters/analyticsChannelId'
      responses:
        '202':
          description: sync queued, or already queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSyncQueued'
        '404':
          $ref: '#/components/responses/analyticsChannelNotFound'
        '409':
          description: the channel is not connected (reconnect it in Settings > YouTube)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /analytics/channels/{id}/suggestions:
    get:
      operationId: listAnalyticsSuggestions
      summary: The channel's suggestions, each with its rule version and evidence
      tags:
        - analytics
      x-min-role: viewer
      parameters:
        - $ref: '#/components/parameters/analyticsChannelId'
        - name: videoId
          in: query
          description: Only this video's suggestions.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{11}$
        - name: includeDismissed
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSuggestionList'
        '404':
          $ref: '#/components/responses/analyticsChannelNotFound'
    patch:
      operationId: updateAnalyticsSuggestion
      summary: Dismiss or restore one suggestion
      tags:
        - analytics
      x-min-role: editor
      parameters:
        - $ref: '#/components/parameters/analyticsChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsSuggestionUpdate'
      responses:
        '204':
          description: updated
        '404':
          description: no such channel or suggestion
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /analytics/channels/{id}/explain:
    post:
      operationId: explainAnalyticsChannel
      summary: Ask the tenant's LLM to explain the channel's numbers (aggregates only, runs in the worker)
      description: Sends only aggregated numbers and the rule findings (no titles or other text from YouTube) to the provider configured for summaries. Poll GET /analytics/explanations/{id} for the answer, which is plain text.
      tags:
        - analytics
      x-min-role: editor
      parameters:
        - $ref: '#/components/parameters/analyticsChannelId'
      responses:
        '202':
          description: explanation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsExplanation'
        '404':
          $ref: '#/components/responses/analyticsChannelNotFound'
        '409':
          description: nothing to explain yet (the channel has no synced data)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: pipeline quota exceeded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /analytics/explanations/{id}:
    get:
      operationId: getAnalyticsExplanation
      summary: The state of an explanation and, once done, its text, provider and cost
      tags:
        - analytics
      x-min-role: viewer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsExplanation'
        '404':
          description: no such explanation in this workspace
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /analytics/videos:
    get:
      operationId: listAnalyticsVideos
      summary: The channel's tracked videos with totals over a window, sorted and paginated
      description: Lists videos published by this app plus videos added for tracking. Videos whose sort metric is not available sort last.
      tags:
        - analytics
      x-min-role: viewer
      parameters:
        - name: channelId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - views
              - watchTime
              - ctr
              - averageViewPercentage
              - published
            default: views
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: '#/components/parameters/analyticsFrom'
        - $ref: '#/components/parameters/analyticsTo'
      responses:
        '200':
          description: one page of videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsVideoPage'
        '400':
          $ref: '#/components/responses/analyticsBadRequest'
        '404':
          $ref: '#/components/responses/analyticsChannelNotFound'
  /analytics/videos/{videoId}:
    get:
      operationId: getAnalyticsVideo
      summary: A tracked video's daily series over a window and its retention curve
      tags:
        - analytics
      x-min-role: viewer
      parameters:
        - $ref: '#/components/parameters/analyticsVideoId'
        - $ref: '#/components/parameters/analyticsFrom'
        - $ref: '#/components/parameters/analyticsTo'
      responses:
        '200':
          description: video detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsVideoDetail'
        '400':
          $ref: '#/components/responses/analyticsBadRequest'
        '404':
          $ref: '#/components/responses/analyticsVideoNotFound'
