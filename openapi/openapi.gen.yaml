          format: uuid
        episodeId:
          type: string
          format: uuid
        lang:
          $ref: '#/components/schemas/SceneLanguage'
        idx:
          type: integer
        paragraphIds:
          type: array
          items:
            type: string
        narration:
          type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SceneSegment'
        imagePrompt:
          type: string
        characterIds:
          type: array
          items:
            type: string
            format: uuid
        motionPreset:
          $ref: '#/components/schemas/MotionPreset'
        imageStyleId:
          type: string
          format: uuid
        durationMs:
          type: integer
        durationMeasured:
          type: boolean
          description: True once a voice take set the duration; before that it is a words-per-minute estimate.
        startMs:
          type: integer
          description: Offset of this scene in the episode timeline.
        tainted:
          type: boolean
        version:
          type: integer
          format: int64
        pips:
          type: array
          items:
            $ref: '#/components/schemas/ScenePip'
        worstState:
          $ref: '#/components/schemas/PipState'
        imageAssetId:
          type: string
          format: uuid
        imageVariants:
          type: boolean
          description: True once WebP/AVIF variants exist for the selected image.
        voiceAssetId:
          type: string
          format: uuid
        alignAssetId:
          type: string
          format: uuid
        peaks:
          type: boolean
          description: True once waveform peaks exist for the selected voice take.
    SceneCounts:
      type: object
      required:
        - all
        - stale
        - failed
        - missing
        - inQueue
      properties:
        all:
          type: integer
        stale:
          type: integer
        failed:
          type: integer
        missing:
          type: integer
        inQueue:
          type: integer
    StageProgress:
      type: object
      required:
        - kind
        - done
        - total
      properties:
        kind:
          $ref: '#/components/schemas/PipKind'
        done:
          type: integer
        total:
          type: integer
    SceneList:
      type: object
      required:
        - items
        - counts
        - stages
        - totalDurationMs
        - activeRunIds
        - missingCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Scene'
        counts:
          $ref: '#/components/schemas/SceneCounts'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageProgress'
        totalDurationMs:
          type: integer
        activeRunIds:
          type: array
          description: Runs with queued or running per-scene steps, for the SSE subscription.
          items:
            type: string
            format: uuid
        missingCount:
          type: integer
          description: How many per-scene steps "Generate missing" would queue.
        nextCursor:
          type: string
    SceneSplitRequest:
      type: object
      required:
        - lang
        - mode
      properties:
        lang:
          $ref: '#/components/schemas/SceneLanguage'
        mode:
          type: string
          enum:
            - paragraphs
            - llm
        cadenceMinS:
          type: integer
          minimum: 5
          maximum: 300
        cadenceMaxS:
          type: integer
          minimum: 5
          maximum: 600
        discardWork:
          type: boolean
          default: false
          description: Confirms that the split may delete scenes a person edited and scenes with takes. Without it such a split answers 409 and changes nothing.
    SceneSplitResult:
      type: object
      required:
        - mode
        - sceneCount
        - keptCount
      properties:
        mode:
          type: string
          enum:
            - paragraphs
            - llm
        sceneCount:
          type: integer
        keptCount:
          type: integer
          description: Scenes whose narration was unchanged, kept with their takes.
        droppedCount:
          type: integer
          description: Old scenes the paragraph split deleted, with their takes.
        unrecognisedSpeakers:
          type: integer
        runId:
          type: string
          format: uuid
        stepId:
          type: string
          format: uuid
    SceneSplitConflict:
      description: A problem body for a split that would delete edited scenes or takes. For an LLM split the counts cover every current scene, because the new scenes are not known yet.
      type: object
      required:
        - title
        - status
        - detail
        - droppedCount
        - editedCount
        - takeCount
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        droppedCount:
          type: integer
        editedCount:
          type: integer
        takeCount:
          type: integer
    TakeKind:
      type: string
      enum:
        - image
        - voice
        - align
    GenerateMissingRequest:
      type: object
      required:
        - lang
      properties:
        lang:
          $ref: '#/components/schemas/SceneLanguage'
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/TakeKind'
    GenerateMissingResponse:
      type: object
      required:
        - queued
      properties:
        runId:
          type: string
          format: uuid
        queued:
          type: object
          required:
            - image
            - voice
            - align
          properties:
            image:
              type: integer
            voice:
              type: integer
            align:
              type: integer
    ScenePatch:
      type: object
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int64
        narration:
          type: string
          minLength: 1
          maxLength: 20000
          description: Replaces the narration; segments are re-derived from it, each quoted line keeping the speaker of the quoted line at the same position. Ignored for segments when segments is also given.
        segments:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/SceneSegment'
        imagePrompt:
          type: string
          maxLength: 4000
        characterIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        motionPreset:
          $ref: '#/components/schemas/MotionPreset'
        imageStyleId:
          type: string
          format: uuid
        clearImageStyle:
          type: boolean
    SceneRegenerateRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/TakeKind'
    SceneTake:
      type: object
      required:
        - id
        - kind
        - assetId
        - selected
        - stale
        - createdAt
        - params
        - variants
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TakeKind'
        assetId:
          type: string
          format: uuid
        selected:
          type: boolean
        stale:
          type: boolean
        durationMs:
          type: integer
        variants:
          type: boolean
        createdAt:
          type: string
          format: date-time
        params:
          type: object
          additionalProperties: true
    SceneTakeList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SceneTake'
    Peaks:
      type: object
      required:
        - peaksPerSecond
        - startMs
        - durationMs
        - min
        - max
      properties:
        peaksPerSecond:
          type: integer
        startMs:
          type: integer
        durationMs:
          type: integer
        min:
          type: array
          description: Per-peak minimum, scaled to -127..127.
          items:
            type: integer
        max:
          type: array
          items:
            type: integer
    AssetVariantName:
      type: string
      enum:
        - original
        - webp-320
        - webp-640
        - webp-1280
        - avif-320
        - avif-640
        - avif-1280
    MediaBackfillResponse:
      type: object
      required:
        - variants
        - peaks
      properties:
        runId:
          type: string
          format: uuid
        variants:
          type: integer
        peaks:
          type: integer
  parameters:
    analyticsChannelId:
      name: id
      in: path
      required: true
      description: Loomtale id of a connected YouTube channel.
      schema:
        type: string
        format: uuid
    analyticsFrom:
      name: from
      in: query
      description: First day of the window (inclusive). Windows span at most 366 days.
      schema:
        type: string
        format: date
    analyticsTo:
      name: to
      in: query
      description: Last day of the window (inclusive).
      schema:
        type: string
        format: date
    analyticsVideoId:
      name: videoId
      in: path
      required: true
      description: YouTube video id.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{11}$
  responses:
    analyticsBadRequest:
      description: invalid window, sort or cursor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    analyticsChannelNotFound:
      description: channel not found in this workspace
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    analyticsVideoNotFound:
      description: the video is not tracked in this workspace
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
