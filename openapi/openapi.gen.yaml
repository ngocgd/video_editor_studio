    post:
      operationId: trackAnalyticsVideo
      summary: Track an existing public video of a connected channel (by URL or id)
      description: Looks the video up with the Data API (1 quota unit) and checks it belongs to the channel. Its metrics arrive with the next sync.
      tags:
        - analytics
      x-min-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackVideoRequest'
      responses:
        '201':
          description: video tracked (or already tracked on this channel)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedVideo'
        '400':
          $ref: '#/components/responses/analyticsBadRequest'
        '404':
          $ref: '#/components/responses/analyticsChannelNotFound'
        '409':
          description: the channel is not connected, or the video is already tracked on another channel
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: no such video, or it belongs to another channel
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: YouTube did not answer the lookup (quota or API error)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
