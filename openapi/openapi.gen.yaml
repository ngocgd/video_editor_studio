      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodeUpdateRequest'
      responses:
        '200':
          description: episode updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Episode'
        '404':
          description: episode not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /episodes/{id}/ai-actions:
    post:
      operationId: createAiAction
      summary: Enqueue a streaming AI writing action at interactive priority
      tags:
        - episodes
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiActionRequest'
      responses:
        '202':
