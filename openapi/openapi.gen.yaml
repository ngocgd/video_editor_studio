          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: no LLM provider available for this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /episodes/{id}/ai-actions/{stepId}:
    get:
      operationId: getAiActionResult
      summary: Poll an AI action step's status and, once done, its generated text
      tags:
        - episodes
      x-min-role: viewer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: current step status, with text once done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiActionResult'
        '404':
          description: episode or step not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /episodes/{id}/drafts/{lang}:
    get:
      operationId: getDraft
      summary: The episode's draft for one language
      tags:
        - episodes
      x-min-role: viewer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DraftLanguage'
      responses:
        '200':
          description: draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDraft'
        '404':
          description: episode or draft not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: createDraft
      summary: Create an empty draft for this episode/language if one does not already exist
      tags:
        - episodes
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DraftLanguage'
      responses:
        '200':
          description: a draft already existed; it is returned unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDraft'
        '201':
          description: an empty draft was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDraft'
        '404':
          description: episode not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: patchDraft
      summary: Autosave paragraph ops with an optimistic-concurrency version check
      tags:
        - episodes
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DraftLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPatchRequest'
      responses:
        '200':
          description: draft updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDraft'
        '409':
          description: expectedVersion is stale; client should refetch and merge
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /episodes/{id}/drafts/{lang}/apply-step:
    post:
      operationId: applyDraftStep
      summary: Apply a finished AI action step's output to the draft server-side, with taint/origin computed from the step and the paragraphs it replaces or follows
      tags:
        - episodes
      x-min-role: editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DraftLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyDraftStepRequest'
      responses:
        '200':
          description: draft updated with the step's output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeDraft'
        '404':
          description: episode or draft not found in this tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: the step is not a done AI action step scoped to this episode
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /imports:
    get:
      operationId: listImports
      summary: Cursor-paginated list of the active tenant's imports
      tags:
        - imports
      x-min-role: viewer
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: page of imports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportList'
    post:
      operationId: createImport
      summary: Register an already-uploaded (presigned + finalized) manuscript asset as a pending import
      tags:
        - imports
      x-min-role: editor
      requestBody:
        required: true
