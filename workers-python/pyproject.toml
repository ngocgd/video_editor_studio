[project]
name = "loomtale-worker"
version = "0.1.0"
description = "Loomtale GPU/CPU worker: gRPC services consumed by the Go API."
requires-python = ">=3.12,<3.13"
dependencies = [
  "grpcio>=1.69.0",
  "grpcio-health-checking>=1.69.0",
  "protobuf>=5.29.0",
  "httpx>=0.27.0",
  # pynvml gives aggregate (not per-process) VRAM stats; gpu.py degrades
  # to "no GPU" if this or the driver is unavailable.
  "nvidia-ml-py>=12.560.0",
]

[dependency-groups]
dev = [
  "ruff>=0.9.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# src/loomtale is buf-generated (proto stubs); never hand-edited or linted.
extend-exclude = ["src/loomtale/worker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/loomtale is buf-generated (proto stubs); src/loomtale_worker is the app.
packages = ["src/loomtale_worker", "src/loomtale"]
