name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_USER: loomtale
          POSTGRES_PASSWORD: loomtale
          POSTGRES_DB: loomtale
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loomtale" --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        image: bitnamilegacy/minio
        env:
          MINIO_ROOT_USER: loomtale-root
          MINIO_ROOT_PASSWORD: loomtale-root-password
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
      - name: go vet
        run: go vet ./...
        working-directory: api
      - name: golangci-lint
        # Same pinned release and checksum as deploy/docker/toolbox.Dockerfile.
        run: |
          curl -sSL -o /tmp/golangci-lint.tar.gz "https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz"
          echo "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab  /tmp/golangci-lint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/golangci-lint.tar.gz -C /tmp
          /tmp/golangci-lint-2.14.0-linux-amd64/golangci-lint run ./...
        working-directory: api
      - name: go test -race
        env:
          DATABASE_URL: postgres://loomtale:loomtale@localhost:5432/loomtale?sslmode=disable
        run: go test ./... -race -count=1
        working-directory: api
      - name: govulncheck
        run: go tool govulncheck ./...
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: bundle openapi and generate the TS client
        run: |
          npx --yes @redocly/cli bundle ../openapi/root.yaml -o ../openapi/openapi.gen.yaml
          npm run gen
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx size-limit
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: workers-python
      - run: uv run ruff check .
        working-directory: workers-python
      - run: uv run pytest -q
        working-directory: workers-python
      - run: uv run pip-audit
        working-directory: workers-python
        continue-on-error: true

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
      - name: provision dev secrets and .env
        run: |
          bash scripts/dev-secrets-init.sh
          echo "BACKUP_TARGET=https://ci-placeholder.invalid" >> .env
          echo "BACKUP_TARGET_BUCKET=ci-placeholder" >> .env
      - name: bring up the full stack
        run: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file .env up -d --wait --build
      - name: run integration tests
        env:
          CI: "true"
          API_BASE_URL: http://127.0.0.1:8080/api/v1
        run: |
          set -a
          . ../.env
          set +a
          export OWNER_DATABASE_URL="postgres://loomtale_owner:${POSTGRES_OWNER_PASSWORD}@127.0.0.1:5432/loomtale?sslmode=disable"
          export DATABASE_URL="postgres://loomtale_app:${POSTGRES_APP_PASSWORD}@127.0.0.1:5432/loomtale?sslmode=disable"
          export BACKUP_DATABASE_URL="postgres://loomtale_backup:${POSTGRES_BACKUP_PASSWORD}@127.0.0.1:5432/loomtale?sslmode=disable"
          go test -tags=integration ./internal/integration/... -race -count=1 -v
        working-directory: api
      - name: start the opt-in llm-cli sidecar (no token in CI, so it stays unhealthy by design)
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file .env --profile claude-cli up -d --no-deps llm-cli
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Status}}' loomtale-llm-cli-1 2>/dev/null || true)
            [ "$state" = "running" ] && break
            sleep 2
          done
          [ "$state" = "running" ] || { echo "llm-cli did not start"; exit 1; }
      - name: llm-cli reports unhealthy without a token (fails closed)
        run: |
          if docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file .env exec -T llm-cli \
            node -e "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          then
            echo "FAIL: llm-cli reported healthy with no token"; exit 1
          else
            echo "OK: llm-cli fails closed without a token"
          fi
      - name: llm-cli cannot reach postgres:5432 (not on its network)
        run: |
          if docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file .env exec -T llm-cli \
            node -e "const c=require('net').createConnection({host:'postgres',port:5432,timeout:3000});c.on('connect',()=>process.exit(1));c.on('error',()=>process.exit(0));c.on('timeout',()=>process.exit(0))"
          then
            echo "OK: llm-cli cannot reach postgres:5432"
          else
            echo "FAIL: llm-cli reached postgres:5432 - network isolation is broken"; exit 1
          fi
      - name: llm-cli cannot reach example.com (internal network, no direct egress)
        run: |
          if docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file .env exec -T llm-cli \
            node -e "const c=require('net').createConnection({host:'example.com',port:443,timeout:3000});c.on('connect',()=>process.exit(1));c.on('error',()=>process.exit(0));c.on('timeout',()=>process.exit(0))"
          then
            echo "OK: llm-cli cannot reach example.com directly"
          else
            echo "FAIL: llm-cli reached example.com directly - network isolation is broken"; exit 1
          fi
      - name: dump service logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file .env logs
      - name: tear down
        if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml --env-file .env down -v

  gen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/tb.sh gen-check

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: create dev-only secrets and .env for the build
        # compose resolves ${VAR:?...} interpolation while parsing the
        # YAML for any subcommand, build included, so every required var
        # must exist even though this job never starts the stack.
        run: |
          bash scripts/dev-secrets-init.sh
          echo "BACKUP_TARGET=https://ci-placeholder.invalid" >> .env
          echo "BACKUP_TARGET_BUCKET=ci-placeholder" >> .env
      - name: build all images
        run: docker compose -f deploy/compose.yml --env-file .env --profile claude-cli build
      - name: assert non-root USER in every built image
        run: |
          for svc in api worker web llmcli egress-proxy; do
            image="loomtale/${svc}:local"
            user="$(docker inspect --format='{{.Config.User}}' "$image")"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "service $svc runs as root ($user)"; exit 1
            fi
          done
      - name: assert every compose service declares mem_limit
        run: |
          docker compose -f deploy/compose.yml --env-file .env --profile claude-cli config > /tmp/compose-rendered.yml
          python3 - /tmp/compose-rendered.yml <<'PY'
          import sys, yaml
          with open(sys.argv[1]) as f:
              cfg = yaml.safe_load(f)
          missing = [name for name, svc in cfg.get("services", {}).items() if "mem_limit" not in svc]
          if missing:
              print("services missing mem_limit:", missing)
              sys.exit(1)
          PY
      - name: assert no docker.sock mount
        run: |
          if docker compose -f deploy/compose.yml --env-file .env --profile claude-cli config | grep -q "docker.sock"; then
            echo "a service mounts the docker socket"; exit 1
          fi
