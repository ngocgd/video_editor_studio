// Health service exposed by every Python worker so the Go side can probe
// readiness over the same gRPC contract used for real jobs. This proves the
// one-toolchain buf pipeline (Go stubs + Python stubs from a single
// `buf generate`) before any real worker RPC is added in phase 4.
syntax = "proto3";

package loomtale.worker.v1;

option go_package = "loomtale/api/internal/workerpb/loomtale/worker/v1;workerv1";

// WorkerHealth reports liveness for a Python GPU/CPU worker process.
service WorkerHealth {
  // Check returns the worker's current status.
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  // Optional service name to scope the check; empty means the whole process.
  string service = 1;
}

message HealthCheckResponse {
  enum Status {
    STATUS_UNKNOWN = 0;
    STATUS_SERVING = 1;
    STATUS_NOT_SERVING = 2;
  }
  Status status = 1;
}
