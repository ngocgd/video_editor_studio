name: loomtale

# Override applied on top of compose.yml when GPU-backed rendering is
# active. Adds the Python worker (pyworker), Ollama (required, no model
# until phase 9b) and joins the Go worker to the internal-only GPU
# network so it alone can reach comfyui/ollama/pyworker (phase 1 wires
# the worker's NVENC device reservation above; this file adds the
# inference backends).
services:
  # Joins loomtale_gpu (internal) so pyworker can reach the presigned
  # URLs storage.Internal issues it: the protos pass URLs, never bytes,
  # over gRPC, so pyworker still holds no MinIO credentials, only
  # network reachability to the presign target host. comfyui and ollama
  # gain reachability to minio too as a result (they are on the same
  # internal network); this is an accepted trade-off (see the plan's
  # phase 4 review) over proxying every byte through the Go worker.
  minio:
    networks: [loomtale_core, loomtale_gpu]

  # One-shot: hands the models volume to the non-root uid the worker and
  # the operator CLI run as (distroless "nonroot", 65532), so model pulls
  # can write it. Files stay world-readable for comfyui (uid 10001) and
  # pyworker, which mount it read-only.
  models-init:
    image: busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    mem_limit: 64m
    network_mode: none
    command: ["sh", "-c", "chown -R 65532:65532 /models && chmod -R u+rwX,go+rX,go-w /models"]
    volumes:
      - loomtale_models:/models
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    restart: "no"

  worker:
    networks: [loomtale_core, loomtale_llm, loomtale_gpu]
    secrets: [pyworker_bearer_token]
    depends_on:
      models-init:
        condition: service_completed_successfully
    # The only long-running service that mounts the models volume
    # writable: models.pull downloads here (the worker is on
    # loomtale_core, which has egress, and only fetches pinned files from
    # Hugging Face). Every GPU container mounts it read-only.
    # The host disk mount lets the download pre-flight read the real
    # free space of the drive holding Docker's data disk: on Docker
    # Desktop the models volume only reports its virtual disk's maximum
    # size. Point MODELS_HOST_DISK_SOURCE at a directory on that drive
    # when it is not the one holding this checkout.
    volumes:
      - loomtale_models:/models
      - ${MODELS_HOST_DISK_SOURCE:-./host-disk}:/host-disk:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      WORKER_GPU: "true"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      COMFYUI_URL: http://comfyui:8188
      PYWORKER_ADDR: pyworker:9090
      PYWORKER_BEARER_TOKEN_PATH: /run/secrets/pyworker_bearer_token
      MODELS_DIR: /models
      MODELS_HOST_DISK_DIR: /host-disk

  # ComfyUI image engine (scene, thumbnail and character sheet
  # workflows). Pinned CUDA base, ComfyUI commit, custom node commit and
  # Python packages (see its Dockerfile); non-root, read-only root
  # filesystem, offline, models read-only, no host port, reachable only
  # from the worker (and the operator CLI) on loomtale_gpu.
  comfyui:
    build:
      context: ..
      dockerfile: deploy/docker/comfyui.Dockerfile
    image: loomtale/comfyui:local
    mem_limit: 10g
    pids_limit: 512
    restart: unless-stopped
    networks: [loomtale_gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - loomtale_models:/app/ComfyUI/models:ro
      # Inputs, outputs, temp files and ComfyUI's user database: a disk
      # volume, not tmpfs, so generated images never count against the
      # container's RAM limit.
      - comfyui_scratch:/scratch
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    # No published ports, including on loopback: loomtale_gpu (internal)
    # already blocks NAT/port-forwarding for this service, and only the
    # worker joins it besides comfyui/ollama/pyworker themselves.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Required service (no profile): the local-default LLM backend per the
  # contract. It has no egress: the worker imports a manifest LLM's pinned
  # GGUF through the blob API on first load (models/ollama/*.Modelfile).
  # registry.QueueFor routes an ollama-backed step to the gpu queue.
  ollama:
    image: ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    mem_limit: 4g
    restart: unless-stopped
    networks: [loomtale_gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_HOST: 0.0.0.0:11434
      # Ollama itself needs no offline env (it manages its own model
      # store), unlike the HF-based engines.
    volumes:
      # Ollama's own volume, never the shared read-only loomtale_models
      # tree: Ollama writes imported blobs into its model store, and a
      # writable mount into the same tree ComfyUI loads .safetensors/.gguf
      # from would let it place arbitrary files (including pickle-capable
      # .ckpt) somewhere ComfyUI might load.
      - ollama_models:/root/.ollama/models
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # The Python gRPC worker (worker/tts/align/train/vision.proto): the
  # Chatterbox, VieNeu-TTS and whisper-align engines. Each is listed and
  # answers engine_not_installed until its pinned weights are installed
  # and the image is built with its runtime (PYWORKER_EXTRAS in .env, e.g.
  # "tts-en tts-vi align"; empty builds the small image without them).
  pyworker:
    build:
      context: ..
      dockerfile: deploy/docker/pyworker.Dockerfile
      args:
        PYWORKER_EXTRAS: ${PYWORKER_EXTRAS:-}
    image: loomtale/pyworker:local
    # Chatterbox, whisper large-v3 and the VieNeu ONNX engine load one at
    # a time; 8g covers the largest with its CPU-side buffers.
    mem_limit: 8g
    restart: unless-stopped
    networks: [loomtale_gpu]
    secrets: [pyworker_bearer_token]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_CACHE: /tmp/hf-cache
      MODELS_DIR: /models
      PYWORKER_BEARER_TOKEN_PATH: /run/secrets/pyworker_bearer_token
    volumes:
      - loomtale_models:/models:ro
    # No host ports, including loopback: reachable only from the worker,
    # exactly like comfyui/ollama, via loomtale_gpu (internal). The
    # healthcheck is a bare TCP connect (python is already the
    # entrypoint's own interpreter): it proves the gRPC port is
    # listening, not a full protocol handshake.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9090), 2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Operator CLI (`loomtale models pull|remove|list`, `loomtale bench`):
  # run on demand with `docker compose ... --profile cli run --rm cli
  # <subcommand>`. Same image and user as the api; it joins the GPU
  # network to reach ComfyUI, pyworker and Ollama for benchmarks, the LLM
  # network to compare against the claude CLI sidecar, and mounts the
  # models volume writable for pulls, like the worker.
  cli:
    profiles: ["cli"]
    image: loomtale/api:local
    entrypoint: ["/usr/local/bin/loomtale"]
    mem_limit: 512m
    networks: [loomtale_core, loomtale_gpu, loomtale_llm]
    secrets: [pyworker_bearer_token, llmcli_bearer_token]
    depends_on:
      models-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://loomtale_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env, see .env.example}@postgres:5432/loomtale?sslmode=disable
      MODELS_DIR: /models
      MODELS_HOST_DISK_DIR: /host-disk
      COMFYUI_URL: http://comfyui:8188
      PYWORKER_ADDR: pyworker:9090
      PYWORKER_BEARER_TOKEN_PATH: /run/secrets/pyworker_bearer_token
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      LLMCLI_URL: http://llm-cli:8090
      LLMCLI_BEARER_TOKEN_PATH: /run/secrets/llmcli_bearer_token
      RENDER_RESERVE_MB: "1024"
    volumes:
      - loomtale_models:/models
      - ${MODELS_HOST_DISK_SOURCE:-./host-disk}:/host-disk:ro
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: "no"

networks:
  # Internal (no egress): comfyui, ollama and pyworker sit here with no
  # host ports; only the Go worker joins it besides them, so these three
  # backends are reachable only from the worker.
  loomtale_gpu:
    driver: bridge
    internal: true

volumes:
  # Populated out-of-band by the model download step (phase 1b/9a);
  # declared here so compose.gpu.yml never tries to (re)create it.
  # pyworker mounts it read-only alongside comfyui; ollama gets its own
  # volume below (see the ollama service's own comment for why it must
  # not share this one).
  loomtale_models:
    external: true
  # Ollama-only, compose-managed (not external): its own model store,
  # separate from loomtale_models so Ollama's writes can never place a
  # file (including a pickle-capable .ckpt) somewhere ComfyUI loads from.
  ollama_models:
  comfyui_scratch:
