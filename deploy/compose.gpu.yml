name: loomtale

# Override applied on top of compose.yml when GPU-backed rendering is
# active. Adds the Python worker (pyworker), Ollama (required, no model
# until phase 9b) and joins the Go worker to the internal-only GPU
# network so it alone can reach comfyui/ollama/pyworker (phase 1 wires
# the worker's NVENC device reservation above; this file adds the
# inference backends).
services:
  worker:
    networks: [loomtale_core, loomtale_llm, loomtale_gpu]
    secrets: [pyworker_bearer_token]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      WORKER_GPU: "true"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      COMFYUI_URL: http://comfyui:8188
      PYWORKER_ADDR: pyworker:9090
      PYWORKER_BEARER_TOKEN_PATH: /run/secrets/pyworker_bearer_token

  # Blackwell (sm_120) + Qwen-Image-Edit smoke spike (phase 1b), hardened
  # by phase 4's network isolation; phase 9a further hardens the image
  # itself (read_only rootfs, resource limits tuned from this spike's
  # measurements). Not started by `make up`; run explicitly with
  # `docker compose -f deploy/compose.yml -f deploy/compose.gpu.yml up -d comfyui`.
  comfyui:
    build:
      context: ..
      dockerfile: deploy/docker/comfyui.Dockerfile
    image: loomtale/comfyui-spike:local
    mem_limit: 10g
    networks: [loomtale_gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - loomtale_models:/app/ComfyUI/models:ro
    # No published ports, including on loopback: loomtale_gpu (internal)
    # already blocks NAT/port-forwarding for this service, and only the
    # worker joins it besides comfyui/ollama/pyworker themselves.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: "no"

  # Required service (no profile): the local-default LLM backend per the
  # contract, with no model pulled until phase 9b's models.pull step.
  # registry.QueueFor routes an ollama-backed step to the gpu queue.
  ollama:
    image: ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    mem_limit: 4g
    restart: unless-stopped
    networks: [loomtale_gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_HOST: 0.0.0.0:11434
      # No model exists on the models volume until phase 9b's pull step;
      # Ollama itself needs no offline env (it manages its own model
      # store), unlike the HF-based engines.
    volumes:
      - loomtale_models:/root/.ollama/models
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # The Python gRPC worker (worker/tts/align/train/vision.proto). No
  # engine is registered before phases 9a-9c: every media RPC honestly
  # fails engine_not_installed, matching ListEngines() == [].
  pyworker:
    build:
      context: ..
      dockerfile: deploy/docker/pyworker.Dockerfile
    image: loomtale/pyworker:local
    mem_limit: 6g
    restart: unless-stopped
    networks: [loomtale_gpu]
    secrets: [pyworker_bearer_token]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYWORKER_BEARER_TOKEN_PATH: /run/secrets/pyworker_bearer_token
    volumes:
      - loomtale_models:/models:ro
    # No host ports, including loopback: reachable only from the worker,
    # exactly like comfyui/ollama, via loomtale_gpu (internal).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  # Internal (no egress): comfyui, ollama and pyworker sit here with no
  # host ports; only the Go worker joins it besides them, so these three
  # backends are reachable only from the worker.
  loomtale_gpu:
    driver: bridge
    internal: true

volumes:
  # Populated out-of-band by the model download step (phase 1b/9a);
  # declared here so compose.gpu.yml never tries to (re)create it. Ollama
  # and pyworker mount the same volume the ComfyUI spike already uses.
  loomtale_models:
    external: true
