# Egress proxy for the llm-cli sidecar: an allowlist-only forward proxy so
# the claude CLI (running with no direct network access beyond llm_net)
# can reach exactly the Anthropic hosts it needs and nothing else. The
# allowlist below is the set recorded during the sidecar auth spike
# (implementation step 1 of the phase 4 plan); if a future CLI version
# needs a new host, the self-check fails loudly and this list is updated
# with the pinned version bump, per the phase 4 rollback plan.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0

Timeout 120
DisableViaHeader Yes

# tinyproxy's Filter directive matches request hosts against this file;
# FilterDefaultDeny makes it allowlist-only instead of blocklist-only.
Filter "/etc/tinyproxy/allowed-hosts.conf"
FilterDefaultDeny Yes
FilterExtended Yes

# CONNECT (HTTPS tunneling) is the only method the CLI needs; plain HTTP
# is never proxied since every Anthropic endpoint is TLS-only.
ConnectPort 443
