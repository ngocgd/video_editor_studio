name: loomtale

# CI-only override: publishes Postgres directly so the integration test
# job (running `go test` on the GitHub Actions runner itself, not in a
# container on loomtale_core) can reach it via 127.0.0.1. Never applied
# outside CI — deploy/compose.yml alone never exposes Postgres.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  # The whole integration suite reaches the API from one client IP, which
  # exceeds the default 100 requests/minute general budget.
  api:
    environment:
      API_RATE_LIMIT_PER_MINUTE: "1000"
  # GitHub-hosted runners have 4 vCPUs; Docker rejects a cpus limit above the host count.
  worker:
    cpus: 2
