# Local model manifest: the single source of truth for every model the
# studio may download or load. `loomtale models lint` (run by `make lint`)
# checks this file; the worker's pull step and the engine loaders read the
# copy embedded into the Go binaries by `make gen`.
#
# Rules enforced by the linter:
# - every file is pinned by repository revision (a 40-char commit sha),
#   sha256 and exact size. Small non-LFS config files, for which the Hub
#   publishes no sha256, are pinned by git_sha1 (their git blob id at the
#   pinned revision) instead;
# - only .safetensors, .gguf, ONNX (.onnx, .data) and .npz weights, plus
#   .json/.txt/.yaml config files, are allowed, and a .bin only when it is
#   declared `format: ctranslate2`; no pickle (.bin, .pt, .ckpt, .pth) can
#   ever be fetched or loaded;
# - every file a model's ComfyUI workflows load (unet, text encoder, VAE,
#   LoRA) is listed under that model, so the file list is transitive; an
#   Ollama entry's Modelfile (models/ollama/<name>.Modelfile) must import
#   one of the entry's pinned GGUF files;
# - a file from a repository under another licence carries its own
#   `licence`, which the licence gate checks too.
#
# The licence gate (api/internal/models/licence.go) allows only
# Apache-2.0, MIT, BSD-2-Clause and BSD-3-Clause. Entries under another
# licence stay listed so the Model manager can show them as blocked, but
# they are refused at install and at load.
#
# vram_mb is the VRAM ceiling planned for the model's workflows on the
# measured budget (free VRAM at boot minus the render reserve). ComfyUI
# runs with --reserve-vram, so a workflow that needs more offloads the
# rest to CPU RAM inside the container's mem_limit instead of taking the
# render reserve.
